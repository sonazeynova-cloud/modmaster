<style>
    :root {
        --bg-color: #0e1621;
        --card-color: #17212b;
        --text-color: #ffffff;
        --subtext-color: #8b98a5;
        --accent-color: #2ea6ff;
        --border-color: #232e3c;
        --danger-color: #e5484d;
    }
    [data-theme="light"] {
        --bg-color: #f1f3f5;
        --card-color: #ffffff;
        --text-color: #111418;
        --subtext-color: #6b7580;
        --accent-color: #1c8ee0;
        --border-color: #dde2e7;
        --danger-color: #d93a3f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        background: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        padding-bottom: 80px;
        max-width: 600px;
        margin: 0 auto;
    }

    /* Splash */
    #splashScreen {
        position: fixed; inset: 0; background: var(--bg-color); z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; transition: opacity 0.4s;
    }
    .splash-logo { font-size: 3.5rem; }
    .spinner {
        width: 32px; height: 32px; border: 3px solid var(--border-color);
        border-top-color: var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #splashLoadingText { color: var(--subtext-color); font-size: 0.85rem; }

    /* Header */
    #mainHeader {
        position: sticky; top: 0; z-index: 50; background: var(--bg-color);
        padding: 12px 14px 8px; border-bottom: 1px solid var(--border-color);
    }
    .header-top { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .search-wrap { position: relative; flex: 1; }
    #searchInput {
        width: 100%; padding: 10px 34px 10px 12px; border-radius: 12px;
        border: 1px solid var(--border-color); background: var(--card-color);
        color: var(--text-color); font-size: 0.9rem; outline: none;
    }
    #searchInput:focus { border-color: var(--accent-color); }
    #clearSearchBtn {
        display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        background: none; border: none; color: var(--subtext-color); font-size: 1.1rem; cursor: pointer;
    }
    .icon-btn {
        width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border-color);
        background: var(--card-color); color: var(--text-color); font-size: 1.2rem; cursor: pointer;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #openAdminBtn { background: var(--accent-color); color: #fff; border: none; font-size: 1.5rem; }
    .delete-mode-active { background: var(--danger-color) !important; color: #fff !important; border-color: var(--danger-color) !important; }
    .header-bottom { display: flex; gap: 8px; align-items: center; }
    .categories { display: flex; gap: 6px; flex: 1; overflow-x: auto; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .category-btn {
        padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border-color);
        background: var(--card-color); color: var(--subtext-color); font-size: 0.8rem;
        cursor: pointer; white-space: nowrap;
    }
    .category-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
    select {
        padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border-color);
        background: var(--card-color); color: var(--text-color); font-size: 0.8rem; outline: none;
    }

    /* Tabs */
    .tab-content { padding: 12px 14px; }
    #favsTab, #trendingTab, #profileTab { display: none; }
    .section-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; }

    /* Mod item */
    .mod-item {
        display: flex; align-items: center; gap: 12px; background: var(--card-color);
        border: 1px solid var(--border-color); border-radius: 14px; padding: 10px; margin-bottom: 10px;
    }
    .mod-icon { width: 54px; height: 54px; border-radius: 12px; object-fit: cover; background: var(--border-color); flex-shrink: 0; }
    .mod-info { flex: 1; min-width: 0; }
    .mod-title-text { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mod-desc {
        color: var(--subtext-color); font-size: 0.78rem; margin-top: 2px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .mod-downloads-count { color: var(--subtext-color); font-size: 0.72rem; margin-top: 4px; }
    .mod-actions { display: flex; flex-direction: column; align-items: stretch; gap: 6px; flex-shrink: 0; }
    .fav-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #f5c518; align-self: flex-end; }
    .download-btn-small {
        background: var(--accent-color); color: #fff; text-decoration: none; text-align: center;
        padding: 6px 12px; border-radius: 10px; font-size: 0.78rem; font-weight: 600;
    }
    .delete-btn-item {
        background: var(--danger-color); color: #fff; border: none; border-radius: 10px;
        padding: 6px 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }

    /* Profile */
    .profile-card {
        background: var(--card-color); border: 1px solid var(--border-color);
        border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .profile-card label { display: block; font-size: 0.85rem; color: var(--subtext-color); margin-bottom: 6px; }
    .profile-card select { width: 100%; padding: 10px; }
    .social-links { display: flex; flex-direction: column; gap: 8px; }
    .social-links a {
        display: block; padding: 10px 12px; border-radius: 10px; background: var(--bg-color);
        color: var(--text-color); text-decoration: none; font-size: 0.9rem; border: 1px solid var(--border-color);
    }

    /* Bottom nav */
    .bottom-nav {
        position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
        width: 100%; max-width: 600px; display: flex; background: var(--card-color);
        border-top: 1px solid var(--border-color); z-index: 60;
    }
    .nav-item {
        flex: 1; text-align: center; padding: 10px 4px 12px; color: var(--subtext-color);
        font-size: 0.72rem; cursor: pointer; user-select: none;
    }
    .nav-item .nav-icon { display: block; font-size: 1.3rem; margin-bottom: 2px; }
    .nav-item.active { color: var(--accent-color); }

    /* Modals */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200;
        display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
        background: var(--card-color); border: 1px solid var(--border-color); border-radius: 16px;
        padding: 18px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;
    }
    .modal-box h3 { margin-bottom: 12px; font-size: 1.05rem; }
    .modal-box p { color: var(--subtext-color); font-size: 0.85rem; margin-bottom: 10px; }
    .modal-box label { display: block; font-size: 0.8rem; color: var(--subtext-color); margin: 10px 0 4px; }
    .modal-box input, .modal-box textarea, .modal-box select {
        width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border-color);
        background: var(--bg-color); color: var(--text-color); font-size: 0.9rem; outline: none; font-family: inherit;
    }
    .modal-box textarea { resize: vertical; min-height: 70px; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 16px; }
    .modal-buttons button {
        flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    .btn-cancel { background: var(--border-color); color: var(--text-color); }
    .btn-primary { background: var(--accent-color); color: #fff; }

    /* Soft tap animation */
    button, .nav-item, .category-btn, .download-btn-small, .fav-btn, .icon-btn, .mod-item, .social-links a {
        transition: transform 0.18s cubic-bezier(.2,.8,.2,1), opacity 0.18s, background-color 0.2s, box-shadow 0.2s;
    }
    button:active, .nav-item:active, .category-btn:active, .download-btn-small:active,
    .icon-btn:active, .social-links a:active { transform: scale(0.93); opacity: 0.85; }
    .fav-btn:active { transform: scale(1.25) rotate(-8deg); }
    .mod-item:active { transform: scale(0.985); }
    #clearSearchBtn { transition: opacity 0.18s; }
    #clearSearchBtn:active { transform: translateY(-50%) scale(0.88); opacity: 0.7; }
    @keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes itemIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .modal-overlay.active { animation: fadeIn 0.2s ease; }
    .modal-overlay.active .modal-box { animation: popIn 0.28s cubic-bezier(.2,.8,.2,1); }
    .tab-content { animation: fadeIn 0.25s ease; }

    /* Photo picker */
    .photo-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .photo-preview {
        width: 72px; height: 72px; border-radius: 14px; border: 2px dashed var(--border-color);
        background: var(--bg-color); cursor: pointer; overflow: hidden; flex-shrink: 0; padding: 0;
        display: flex; align-items: center; justify-content: center; color: var(--text-color);
    }
    .photo-preview-icon { font-size: 1.8rem; }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
    .photo-preview.has-img { border-style: solid; border-color: var(--accent-color); }
    .btn-pick {
        flex: 1; padding: 14px 10px; border-radius: 12px; border: 1px solid var(--accent-color);
        background: transparent; color: var(--accent-color); font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    .or-url { font-size: 0.72rem; color: var(--subtext-color); margin: 6px 0 4px; }

    /* Splash animation (cinematic) */
    #splashScreen {
        --bg-color: #060b14; --text-color: #ffffff; --subtext-color: #8b98a5; --accent-color: #2ea6ff; --border-color: #1b2838;
        overflow: hidden; background: #060b14; transition: opacity 0.55s ease;
    }
    #splashScreen.leaving { opacity: 0; pointer-events: none; }
    #splashScreen.leaving .splash-rays, #splashScreen.leaving .splash-ring, #splashScreen.leaving .flare,
    #splashScreen.leaving .splash-flash, #splashScreen.leaving .title-wrap::after { display: none; }
    #splashCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .stage {
        position: relative; z-index: 2; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        animation: shake 0.6s ease-out 1.1s backwards;
    }

    .splash-rays {
        position: absolute; width: 940px; height: 940px; border-radius: 50%;
        left: calc(var(--bx, 50%) - 470px); top: calc(var(--by, 40%) - 470px);
        background: conic-gradient(transparent 0 8%, rgba(46,166,255,0.26) 10%, transparent 14% 33%, rgba(46,166,255,0.2) 35%, transparent 39% 58%, rgba(46,166,255,0.24) 60%, transparent 64% 83%, rgba(46,166,255,0.18) 85%, transparent 89%);
        -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%); mask-image: radial-gradient(circle, #000 0%, transparent 62%);
        opacity: 0; will-change: transform; animation: raysIn 1.2s ease 1.1s forwards, raysSpin 14s linear infinite;
    }
    .singularity {
        position: absolute; left: var(--bx, 50%); top: var(--by, 40%); width: 10px; height: 10px; margin: -5px 0 0 -5px;
        border-radius: 50%; background: #fff; opacity: 0;
        box-shadow: 0 0 18px 8px #2ea6ff, 0 0 60px 22px rgba(46,166,255,0.6);
        animation: singu 1.1s ease-in both;
    }
    .splash-flash {
        position: absolute; inset: 0; opacity: 0; pointer-events: none;
        background: radial-gradient(circle at var(--bx, 50%) var(--by, 40%), #fff 0%, rgba(160,215,255,0.85) 22%, rgba(46,166,255,0.25) 48%, transparent 70%);
        animation: flashAnim 1s ease-out 1.1s both;
    }

    .cube-scene { position: relative; width: 84px; height: 84px; perspective: 700px; margin-bottom: 46px; }
    .cube-scene::after {
        content: ''; position: absolute; left: 50%; bottom: -44px; width: 110px; height: 16px; transform: translateX(-50%);
        background: radial-gradient(ellipse, rgba(46,166,255,0.6), transparent 70%);
        animation: fadeIn 1s ease 1.4s both, shadowPulse 2.6s ease-in-out 2s infinite;
    }
    .orbit { position: absolute; left: 50%; top: 50%; border-radius: 50%; animation: orbitIn 0.9s cubic-bezier(.2,1.2,.3,1) 1.3s backwards; }
    .orbit::before { content: ''; position: absolute; inset: 0; border-radius: 50%; }
    .orbit.o1 { width: 150px; height: 150px; margin: -75px 0 0 -75px; }
    .orbit.o1::before { border: 2px solid transparent; border-top-color: #bfe6ff; border-right-color: rgba(154,214,255,0.35); animation: spinA 2.2s linear infinite; }
    .orbit.o2 { width: 196px; height: 196px; margin: -98px 0 0 -98px; }
    .orbit.o2::before { border: 1.5px dashed rgba(124,200,255,0.55); animation: spinB 12s linear infinite; }
    .splash-ring {
        position: absolute; left: 50%; top: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%;
        border: 2px solid var(--accent-color); opacity: 0; animation: ringOut 2.4s ease-out 1.1s infinite;
    }
    .splash-ring.r2 { animation-delay: 1.7s; }
    .splash-ring.r3 { animation-delay: 2.3s; }
    .flare {
        position: absolute; left: 50%; top: 50%; width: 150vw; height: 3px; margin: -1.5px 0 0 -75vw; opacity: 0;
        background: linear-gradient(90deg, transparent, #7cc8ff 30%, #fff 50%, #7cc8ff 70%, transparent);
        box-shadow: 0 0 26px 6px rgba(46,166,255,0.85); transform: scaleX(0);
        animation: flareAnim 1.3s ease-out 1.1s both;
    }

    .cube-float { width: 100%; height: 100%; transform-style: preserve-3d; animation: floatY 2.6s ease-in-out 2.2s infinite; }
    .cube { --h: 42px; position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: cubeIn 1.3s cubic-bezier(.2,1.25,.3,1) 1.1s both, cubeSpin 7s linear 2.4s infinite; }
    .core { --h: 21px; position: absolute; inset: 21px; transform-style: preserve-3d; animation: coreSpin 4s linear infinite; }
    .face {
        position: absolute; inset: 0; border: 2px solid rgba(255,255,255,0.6);
        background: linear-gradient(135deg, rgba(46,166,255,0.38), rgba(20,90,200,0.18));
        box-shadow: inset 0 0 20px rgba(255,255,255,0.28), 0 0 22px rgba(46,166,255,0.45);
        border-radius: 6px; animation: faceIn 0.5s ease both; animation-delay: calc(1.1s + var(--d) * 0.08s);
    }
    .core .face { border-color: #fff; box-shadow: 0 0 24px rgba(124,200,255,0.9); border-radius: 3px; }
    .f-front  { transform: rotateY(0deg)   translateZ(var(--h)); }
    .f-back   { transform: rotateY(180deg) translateZ(var(--h)); }
    .f-right  { transform: rotateY(90deg)  translateZ(var(--h)); }
    .f-left   { transform: rotateY(-90deg) translateZ(var(--h)); }
    .f-top    { transform: rotateX(90deg)  translateZ(var(--h)); }
    .f-bottom { transform: rotateX(-90deg) translateZ(var(--h)); }
    .f-front, .f-back { background: linear-gradient(135deg, rgba(150,215,255,0.5), rgba(40,130,235,0.3)); }
    .f-right, .f-left { background: linear-gradient(135deg, rgba(46,150,255,0.42), rgba(15,70,170,0.34)); }
    .f-top { background: linear-gradient(135deg, rgba(210,240,255,0.6), rgba(90,180,255,0.4)); }
    .f-bottom { background: linear-gradient(135deg, rgba(20,80,180,0.4), rgba(10,40,110,0.4)); }
    .core .face { background: linear-gradient(135deg, #7cc8ff, #1c8ee0); }

    .title-wrap { position: relative; overflow: hidden; padding: 16px 30px; z-index: 2; }
    .title-wrap::after {
        content: ''; position: absolute; top: 0; bottom: 0; left: -80px; width: 46px; opacity: 0;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,0.4), transparent);
        filter: blur(4px); transform: skewX(-20deg); animation: sweep 3.4s ease-in-out 2.9s infinite;
    }
    .splash-title {
        position: relative; display: block; white-space: nowrap; font-size: 2.2rem; font-weight: 900; letter-spacing: 0.1em;
        color: #fff; opacity: 0; text-shadow: 0 0 14px #2ea6ff, 0 0 32px rgba(46,166,255,0.6);
        animation: titleIn 0.3s linear 2.4s forwards;
    }
    .splash-title::before, .splash-title::after {
        content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; white-space: nowrap;
        pointer-events: none; opacity: 0; text-shadow: none;
    }
    .splash-title::before { color: #ff3b7a; animation: glitchA 3.2s steps(1, end) 2.4s infinite; }
    .splash-title::after  { color: #19e3ff; animation: glitchB 3.2s steps(1, end) 2.4s infinite; }
    .splash-line { position: relative; height: 2px; width: 0; margin-top: -4px; border-radius: 2px; z-index: 2;
        background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        box-shadow: 0 0 14px var(--accent-color); animation: lineGrow 0.9s ease 2.6s forwards; }
    .splash-bar { position: relative; width: 190px; height: 5px; border-radius: 5px; background: var(--border-color); overflow: hidden; margin-top: 22px; z-index: 2; animation: fadeIn 0.5s ease 1.5s both; }
    .splash-bar span { display: block; height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--accent-color), #9ad6ff); box-shadow: 0 0 10px var(--accent-color); }
    .splash-percent { position: relative; z-index: 2; margin-top: 8px; font-size: 0.8rem; font-weight: 700; color: var(--accent-color); font-variant-numeric: tabular-nums; animation: fadeIn 0.5s ease 1.6s both; }
    #splashLoadingText { position: relative; z-index: 2; animation: fadeIn 0.6s ease 1.7s both; }

    @keyframes singu { 0% { transform: scale(0); opacity: 0; } 15% { opacity: 1; } 92% { transform: scale(2.2); opacity: 1; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes flashAnim { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes flareAnim { 0% { transform: scaleX(0); opacity: 1; } 30% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1.15) scaleY(0); opacity: 0; } }
    @keyframes shake { 0% { transform: translate(0,0); } 10% { transform: translate(-7px,4px); } 20% { transform: translate(6px,-5px); } 30% { transform: translate(-5px,3px); } 42% { transform: translate(4px,-2px); } 60% { transform: translate(-2px,1px); } 100% { transform: translate(0,0); } }
    @keyframes orbitIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes spinA { to { transform: rotate(360deg); } }
    @keyframes spinB { to { transform: rotate(-360deg); } }
    @keyframes cubeIn { from { transform: rotateX(-25deg) rotateY(-540deg) scale(0); } to { transform: rotateX(-25deg) rotateY(45deg) scale(1); } }
    @keyframes cubeSpin { from { transform: rotateX(-25deg) rotateY(45deg); } to { transform: rotateX(-25deg) rotateY(405deg); } }
    @keyframes coreSpin { from { transform: rotateX(0deg) rotateY(0deg); } to { transform: rotateX(360deg) rotateY(-360deg); } }
    @keyframes faceIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes shadowPulse { 0%, 100% { opacity: 1; transform: translateX(-50%) scaleX(1); } 50% { opacity: 0.55; transform: translateX(-50%) scaleX(0.8); } }
    @keyframes raysIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes raysSpin { to { transform: rotate(360deg); } }
    @keyframes ringOut { 0% { opacity: 0.85; transform: scale(0.6); } 100% { opacity: 0; transform: scale(4.4); } }
    @keyframes titleIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes titleBreath { 0%, 100% { text-shadow: 0 0 12px #2ea6ff, 0 0 28px rgba(46,166,255,0.5); } 50% { text-shadow: 0 0 20px #7cc8ff, 0 0 46px rgba(46,166,255,0.85); } }
    @keyframes glitchA {
        0% { opacity: 1; transform: translate(-5px, 1px); clip-path: inset(8% 0 58% 0); }
        4% { opacity: 1; transform: translate(6px, -2px); clip-path: inset(56% 0 8% 0); }
        8% { opacity: 1; transform: translate(-3px, 0); clip-path: inset(30% 0 36% 0); }
        12%, 100% { opacity: 0; }
    }
    @keyframes glitchB {
        0% { opacity: 1; transform: translate(5px, -1px); clip-path: inset(50% 0 12% 0); }
        4% { opacity: 1; transform: translate(-6px, 2px); clip-path: inset(12% 0 55% 0); }
        8% { opacity: 1; transform: translate(3px, 0); clip-path: inset(38% 0 28% 0); }
        12%, 100% { opacity: 0; }
    }
    @keyframes sweep { 0% { left: -80px; opacity: 1; } 35% { left: 110%; opacity: 1; } 36%, 100% { left: 110%; opacity: 0; } }
    @keyframes lineGrow { to { width: 240px; } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: none; } }
    @keyframes navUp { from { opacity: 0; transform: translateX(-50%) translateY(50px); } to { opacity: 1; transform: translateX(-50%); } }
    .ready #mainHeader { animation: slideDown 0.7s cubic-bezier(.2,.9,.3,1) 0.3s both; }
    .ready .bottom-nav { animation: navUp 0.7s cubic-bezier(.2,.9,.3,1) 0.4s both; }

    /* Gallery picker (label-based, works on mobile) */
    .file-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
    .photo-preview {
        width: 72px; height: 72px; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center;
        border-radius: 14px; border: 2px dashed var(--border-color); background: var(--bg-color);
        overflow: hidden; flex-shrink: 0; cursor: pointer; color: var(--text-color);
    }
    .photo-preview.has-img { border-style: solid; border-color: var(--accent-color); }
    .btn-pick {
        flex: 1; margin: 0; display: flex; align-items: center; justify-content: center; text-align: center;
        padding: 14px 10px; border-radius: 12px; border: 1px solid var(--accent-color);
        color: var(--accent-color); font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    .photo-row:active .btn-pick, .photo-row:active .photo-preview { transform: scale(0.96); opacity: 0.85; }

    .photo-row { position: relative; }
    .modal-box input.file-overlay {
        position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; z-index: 3;
        padding: 0; border: 0; background: none; cursor: pointer; font-size: 0;
    }

    .toast {
        position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 20px); z-index: 500; width: calc(100% - 32px); max-width: 420px;
        background: #263445; color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 0.82rem; line-height: 1.35;
        opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .retry-btn { margin-top: 12px; padding: 9px 18px; border-radius: 10px; border: 1px solid var(--accent-color); background: transparent; color: var(--accent-color); font-size: 0.85rem; font-weight: 600; cursor: pointer; }

    .pwd-error { color: #ff7b7b; font-size: 0.82rem; margin-top: 10px; min-height: 1.1em; word-break: break-word; line-height: 1.35; }

    /* Header layout: no more shifted/cut buttons in long languages */
    .header-bottom { flex-direction: column; align-items: stretch; gap: 8px; }
    .categories { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; overflow: visible; flex: none; }
    .category-btn { padding: 8px 4px; font-size: 0.78rem; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    #sortSelect { width: 100%; }
    .nav-item span:not(.nav-icon) { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .social-links a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>

<!-- Splash -->
<div id="splashScreen">
    <canvas id="splashCanvas"></canvas>
    <div class="splash-rays"></div>
    <div class="singularity"></div>
    <div class="splash-flash"></div>

        <div class="cube-scene" id="splashScene">
            <div class="orbit o1"></div><div class="orbit o2"></div>
            <div class="splash-ring r1"></div><div class="splash-ring r2"></div><div class="splash-ring r3"></div>

        <div id="splashLoadingText">Loading...</div>

</div>

<!-- Header -->

        <select id="sortSelect">
            <option value="newest" id="optNewest">En Yeni</option>

            <option value="az" id="optAz">A-Z</option>
        </select>
    </div>
</header>

<!-- Tabs -->
<div id="homeTab" class="tab-content">

</div>

    <div id="favsList"></div>
</div>

    <div id="trendingList"></div>
</div>

<div id="profileTab" class="tab-content">

        <label id="themeLabel" for="themeSelect">Tema (Arka Plan)</label>

            <option value="dark" id="themeDarkOpt">Siyah (Koyu)</option>
            <option value="light" id="themeLightOpt">Beyaz (Açık)</option>
        </select>

    <script>
        const _mem = {};
        function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return (k in _mem) ? _mem[k] : null; } }
        function safeSet(k, v) {
            try { localStorage.setItem(k, v); return true; }
            catch (e) { if (e && (e.name === 'QuotaExceededError' || e.code === 22)) return false; _mem[k] = v; return true; }
        }
        // ================= FIREBASE AYARI (herkesin gördüğü ortak mod listesi) =================
        // Boş bırakırsan site "yerel mod"da çalışır (modlar sadece bu telefonda durur).
        // Firebase kurulumundan sonra aşağıdaki iki değeri doldur:

            apiKey: "AIzaSyCQQIOQIDwpVkH8UN1234MvQjWkxastZmc",                          // Web API Key
            projectId: "modmaster-a1b2c",                       // Proje kimliği (Project ID)

        function safeUrl(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : '#'; }
        function safeImg(u) { u = String(u || ''); return /^(data:image\/(png|jpe?g|webp|gif);base64,|https?:\/\/)/i.test(u) ? u : PLACEHOLDER; }

        } catch (e) { mods = []; }

        let selectedImgData = '';
        function setText(id, value) { const el = document.getElementById(id); if (el) el.innerText = value; }

        // ---- Ortak veritabanı (Firestore REST) ----
        const FS_ROOT = () => 'projects/' + FIREBASE.projectId + '/databases/(default)/documents';
        const FS_URL = () => 'https://firestore.googleapis.com/v1/' + FS_ROOT();
        function fetchT(url, opts, ms) {
            return new Promise((resolve, reject) => {
                const tm = setTimeout(() => { const e = new Error('TIMEOUT'); e.name = 'AbortError'; reject(e); }, ms || 15000);
                fetch(url, opts).then(r => { clearTimeout(tm); resolve(r); }, e => { clearTimeout(tm); reject(e); });
            });
        }
        function errText(e) {
            if (!e) return 'ERROR';
            const msg = (typeof e.code === 'string' && e.code) ? e.code : (e.message || String(e.code || e));
            if (e.name === 'AbortError') return 'TIMEOUT';
            return (e.name && e.name !== 'Error' && e.name !== 'TypeError') ? (e.name + ': ' + msg) : msg;
        }
        async function apiJson(r) { try { return await r.json(); } catch (e) { return {}; } }
        function apiErr(r, j) { const e = j && j.error; return new Error((e && (e.status || e.message)) || ('HTTP ' + r.status)); }
        function fsDecode(doc) {
            const f = doc.fields || {};
            const str = (k) => (f[k] && f[k].stringValue !== undefined) ? f[k].stringValue : '';
            const num = (k) => f[k] ? Number(f[k].integerValue !== undefined ? f[k].integerValue : (f[k].doubleValue || 0)) : 0;
            return { id: String(doc.name.split('/').pop()).replace(/[^\w-]/g, ''), title: str('title'), desc: str('desc'), img: str('img'),
                     link: str('link'), category: str('category') || 'addon', date: num('date'), downloads: num('downloads') };
        }
        function fsEncode(m) {
            return { fields: { title: { stringValue: m.title }, desc: { stringValue: m.desc }, img: { stringValue: m.img }, link: { stringValue: m.link },
                               category: { stringValue: m.category }, date: { integerValue: String(m.date) }, downloads: { integerValue: '0' } } };
        }
        async function adminLogin(code) {
            const r = await fetchT('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + encodeURIComponent(FIREBASE.apiKey), {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: FIREBASE.adminEmail, password: code, returnSecureToken: true })
            });
            const j = await apiJson(r);
            if (!r.ok) { const e = new Error((j.error && j.error.message) || ('HTTP ' + r.status)); e.code = e.message; throw e; }
            adminToken = j.idToken; adminTokenExp = Date.now() + ((Number(j.expiresIn) || 3600) - 60) * 1000; adminCode = code;
        }
        async function authHeader() {
            if (!adminToken || Date.now() > adminTokenExp) { if (!adminCode) throw new Error('NOT_LOGGED_IN'); await adminLogin(adminCode); }
            return { 'Authorization': 'Bearer ' + adminToken, 'Content-Type': 'application/json' };
        }
        async function cloudAdd(m) {
            const r = await fetchT(FS_URL() + '/mods?documentId=' + encodeURIComponent(m.id), { method: 'POST', headers: await authHeader(), body: JSON.stringify(fsEncode(m)) });
            if (!r.ok) throw apiErr(r, await apiJson(r));
        }
        async function cloudDelete(id) {
            const r = await fetchT(FS_URL() + '/mods/' + encodeURIComponent(id), { method: 'DELETE', headers: await authHeader() });
            if (!r.ok) throw apiErr(r, await apiJson(r));
        }
        function cloudIncrement(id) {
            fetchT(FS_URL() + ':commit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ writes: [{ transform: { document: FS_ROOT() + '/mods/' + id,
                    fieldTransforms: [{ fieldPath: 'downloads', increment: { integerValue: '1' } }] } }] }) }).catch(() => {});
        }
        async function loadCloudMods() {
            if (!CLOUD) return;
            cloudState = 'loading'; cloudErrorText = ''; renderAll();
            try {
                const list = []; let token = '';
                for (let i = 0; i < 30; i++) {
                    const r = await fetchT(FS_URL() + '/mods?pageSize=100' + (token ? '&pageToken=' + encodeURIComponent(token) : ''));
                    const j = await apiJson(r);
                    if (!r.ok) throw apiErr(r, j);
                    (j.documents || []).forEach(d => list.push(fsDecode(d)));
                    token = j.nextPageToken || '';
                    if (!token) break;
                }
                mods = list; cloudState = 'ok'; lastCloudLoad = Date.now(); saveMods();
            } catch (e) { cloudState = 'error'; cloudErrorText = errText(e); }
            renderAll();
        }

        function renderMods() {
            const listEl = document.getElementById('modList');
            listEl.innerHTML = '';
            const t = translations[currentLang];
            let filtered = mods.filter(m => {
                let matchesCat = (currentCategory === 'all' || m.category === currentCategory);
                let matchesSearch = m.title.toLowerCase().includes(searchQuery.toLowerCase()) || m.desc.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });
            if (currentSort === 'newest') filtered.sort((a, b) => b.date - a.date);
            else if (currentSort === 'popular') filtered.sort((a, b) => (b.downloads || 0) - (a.downloads || 0));
            else if (currentSort === 'az') filtered.sort((a, b) => a.title.localeCompare(b.title));

            if (filtered.length === 0) {
                let msg = esc(t.noMods);
                if (CLOUD && mods.length === 0) {
                    if (cloudState === 'loading' || cloudState === 'idle') msg = esc(t.loadingMods);

                }
                listEl.innerHTML = `<p style="text-align:center; color:var(--subtext-color); margin-top:30px; font-size:0.85rem; padding:0 20px;">${msg}</p>`;
                return;

                        <a href="${esc(safeUrl(mod.link))}" class="download-btn-small" target="_blank" rel="noopener" onclick="incrementDownload('${esc(mod.id)}')">${t.download}</a>
                        <button class="delete-btn-item" style="display: ${isDeleteMode ? 'block' : 'none'};" onclick="deleteMod('${esc(mod.id)}')">${t.delete}</button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

                    <div class="mod-actions">
                        <button class="fav-btn" onclick="toggleFav('${esc(mod.id)}')">⭐</button>
                        <a href="${esc(safeUrl(mod.link))}" class="download-btn-small" target="_blank" rel="noopener" onclick="incrementDownload('${esc(mod.id)}')">${t.download}</a>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function renderTrending() {
            const listEl = document.getElementById('trendingList');
            listEl.innerHTML = '';
            const t = translations[currentLang];
            let trendMods = [...mods].sort((a, b) => (b.downloads || 0) - (a.downloads || 0)).slice(0, 10);
            if (trendMods.length === 0 || trendMods.every(m => (m.downloads || 0) === 0)) {
                listEl.innerHTML = `<p style="text-align:center; color:var(--subtext-color); margin-top:30px; font-size:0.85rem;">${t.noTrending}</p>`;
                return;
            }
            trendMods.forEach((mod, index) => {
                const isFav = favs.includes(mod.id);
                const item = document.createElement('div');
                item.className = 'mod-item';
                item.innerHTML = `
                    <div style="font-weight: bold; color: var(--accent-color); font-size: 1rem; width: 24px; text-align: center;">#${index + 1}</div>
                    <img src="${safeImg(mod.img)}" class="mod-icon" alt="">
                    <div class="mod-info">
                        <div class="mod-title-text">${esc(mod.title)}</div>
                        <div class="mod-desc">${esc(mod.desc)}</div>
                        <div class="mod-downloads-count">🔥 ${mod.downloads || 0} ${t.downloadsText}</div>
                    </div>
                    <div class="mod-actions">
                        <button class="fav-btn" onclick="toggleFav('${esc(mod.id)}')">${isFav ? '⭐' : '☆'}</button>
                        <a href="${esc(safeUrl(mod.link))}" class="download-btn-small" target="_blank" rel="noopener" onclick="incrementDownload('${esc(mod.id)}')">${t.download}</a>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function toggleFav(id) {
            id = String(id);
            if (favs.includes(id)) { favs = favs.filter(favId => favId !== id); }
            else { favs.push(id); }
            saveFavs();
            renderAll();
        }

        // Bu telefonda hangi modlar daha önce sayıldı (tekrar basınca sayı artmasın)
        let counted = [];
        try { counted = (JSON.parse(safeGet('telegram_counted') || '[]') || []).map(String); } catch (e) { counted = []; }

        function incrementDownload(id) {
            id = String(id);
            const mod = mods.find(m => m.id === id);
            if (!mod) return;
            if (counted.includes(id)) return;          // aynı telefon aynı modu bir kez sayılır
            counted.push(id);
            safeSet('telegram_counted', JSON.stringify(counted));
            mod.downloads = (mod.downloads || 0) + 1;
            saveMods();
            if (CLOUD) cloudIncrement(id);
            setTimeout(renderAll, 0);   // bağlantı açılsın, sonra listeyi yenile
        }

        async function deleteMod(id) {
            id = String(id);
            const t = translations[currentLang];
            if (!confirm(t.confirmDelete)) return;
            if (CLOUD) {
                try { await cloudDelete(id); }
                catch (e) { showToast(t.cloudFail + ': ' + errText(e), 9000); return; }
            }
            mods = mods.filter(m => m.id !== id);
            saveMods();
            renderAll();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            document.getElementById('clearSearchBtn').style.display = searchQuery ? 'block' : 'none';
            renderMods();
        });

        document.getElementById('clearSearchBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            renderMods();
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderMods();
        });

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.getAttribute('data-category');
                renderMods();
            });
        });

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const tab = item.getAttribute('data-tab');
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                document.getElementById('homeTab').style.display = (tab === 'home') ? 'block' : 'none';
                document.getElementById('favsTab').style.display = (tab === 'favs') ? 'block' : 'none';
                document.getElementById('trendingTab').style.display = (tab === 'trending') ? 'block' : 'none';
                document.getElementById('profileTab').style.display = (tab === 'profile') ? 'block' : 'none';
                document.getElementById('mainHeader').style.display = (tab === 'home') ? 'block' : 'none';
            });
        });

        document.getElementById('themeSelect').addEventListener('change', (e) => applyTheme(e.target.value));
        document.getElementById('langSelect').addEventListener('change', (e) => applyLang(e.target.value, true));

        const passwordModal = document.getElementById('passwordModal');
        const openAdminBtn = document.getElementById('openAdminBtn');
        const pwdCancelBtn = document.getElementById('pwdCancelBtn');
        const pwdSubmitBtn = document.getElementById('pwdSubmitBtn');
        const inputAdminPassword = document.getElementById('inputAdminPassword');

        function setPwdError(m) { const el = document.getElementById('pwdError'); if (el) el.textContent = m || ''; }
        function askPassword(action) {
            pendingAction = action;
            setPwdError('');
            inputAdminPassword.value = '';
            passwordModal.classList.add('active');
            setTimeout(() => inputAdminPassword.focus(), 200);
        }
        inputAdminPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') pwdSubmitBtn.click(); });

        openAdminBtn.addEventListener('click', () => {
            pendingAction = 'add';
            setPwdError('');
            inputAdminPassword.value = '';
            passwordModal.classList.add('active');
            setTimeout(() => inputAdminPassword.focus(), 200);
        });

        pwdCancelBtn.addEventListener('click', () => { passwordModal.classList.remove('active'); });

        pwdSubmitBtn.addEventListener('click', async () => {
            const t = translations[currentLang];
            const code = inputAdminPassword.value;
            let ok = false;
            if (CLOUD) {
                pwdSubmitBtn.disabled = true; setPwdError(''); pwdSubmitBtn.innerText = '...';
                try { await adminLogin(code); ok = true; }
                catch (e) {
                    const c = errText(e);
                    if (/INVALID_(LOGIN_CREDENTIALS|PASSWORD)|MISSING_PASSWORD/.test(c)) setPwdError(t.wrongPassword);
                    else setPwdError(t.cloudFail + ': ' + c);
                }
                pwdSubmitBtn.disabled = false; pwdSubmitBtn.innerText = t.pwdOk;
            } else {
                ok = (typeof ADMIN_PASSWORD !== 'undefined' && code === ADMIN_PASSWORD);
                if (!ok) setPwdError(t.wrongPassword);
            }
            if (!ok) { inputAdminPassword.value = ''; return; }
            passwordModal.classList.remove('active');
            if (pendingAction === 'delete') { setDeleteMode(true); return; }
            document.getElementById('inputModTitle').value = '';
            document.getElementById('inputModDesc').value = '';
            document.getElementById('inputModLink').value = '';
            resetPhotoPicker();
            document.getElementById('addModModal').classList.add('active');
        });

        const addModModal = document.getElementById('addModModal');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalSaveBtn = document.getElementById('modalSaveBtn');

        modalCancelBtn.addEventListener('click', () => { addModModal.classList.remove('active'); });
        addModModal.addEventListener('click', (e) => { if (e.target === addModModal) { addModModal.classList.remove('active'); } });

        modalSaveBtn.addEventListener('click', async () => {
            const t = translations[currentLang];
            const title = document.getElementById('inputModTitle').value.trim();
            const desc = document.getElementById('inputModDesc').value.trim();
            const img = selectedImgData || '';
            let link = document.getElementById('inputModLink').value.trim();
            const category = document.getElementById('inputModCat').value;

            if (!title || !link) { alert(t.linkRequired); return; }
            if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(link)) link = 'https://' + link;

            const newMod = { id: String(Date.now()), title, desc, img, link, category, date: Date.now(), downloads: 0 };
            if (CLOUD) {
                modalSaveBtn.disabled = true; modalSaveBtn.innerText = t.saving;
                try { await cloudAdd(newMod); }
                catch (e) {
                    showToast(t.cloudFail + ': ' + errText(e), 9000);
                    modalSaveBtn.disabled = false; modalSaveBtn.innerText = t.btnSave; return;
                }
                modalSaveBtn.disabled = false; modalSaveBtn.innerText = t.btnSave;
                mods.unshift(newMod); saveMods();
            } else {
                mods.unshift(newMod);
                if (!saveMods()) { mods.shift(); return; }
            }
            renderAll();
            addModModal.classList.remove('active');
        });


        // ---- Gallery photo picker ----
        const inputModFile = document.getElementById('inputModFile');
        function resetPhotoPicker() {
            selectedImgData = '';
            inputModFile.value = '';
            document.getElementById('photoPreviewImg').style.display = 'none';
            document.getElementById('photoPreviewImg').removeAttribute('src');
            document.getElementById('photoPreviewIcon').style.display = '';
            document.getElementById('photoPreview').classList.remove('has-img');
            setText('pickPhotoLabel', translations[currentLang].pickPhoto);
        }

        // Seçici açılmazsa (ör. uygulama içi önizleme engelliyorsa) kullanıcıyı bilgilendir
        let galleryTimer = null;
        function showToast(msg, ms) {
            const el = document.getElementById('toast'); if (!el) return;
            el.textContent = msg; el.classList.add('show');
            clearTimeout(showToast._t); showToast._t = setTimeout(() => el.classList.remove('show'), ms || 6500);
        }
        function clearGalleryTimer() { clearTimeout(galleryTimer); galleryTimer = null; }
        let galleryClickAt = 0;
        inputModFile.addEventListener('click', () => {
            clearGalleryTimer();
            galleryClickAt = Date.now();
            galleryTimer = setTimeout(() => showToast(translations[currentLang].galleryHint), 1600);
        });
        // Çok hızlı gelen "iptal" = seçici hiç açılmadı (engelli ortam); gerçek iptal daha uzun sürer
        inputModFile.addEventListener('cancel', () => {
            const quick = Date.now() - galleryClickAt < 900;
            clearGalleryTimer();
            if (quick) showToast(translations[currentLang].galleryHint);
        });
        window.addEventListener('blur', clearGalleryTimer);
        document.addEventListener('visibilitychange', clearGalleryTimer);
        window.addEventListener('pagehide', clearGalleryTimer);

        inputModFile.addEventListener('change', () => {
            clearGalleryTimer();
            const file = inputModFile.files && inputModFile.files[0];
            if (!file) return;
            const t = translations[currentLang];
            const reader = new FileReader();
            reader.onerror = () => alert(t.imgError);
            reader.onload = () => {
                const image = new Image();
                image.onerror = () => alert(t.imgError);
                image.onload = () => {
                    // Küçült: en fazla 160px (ortak veritabanında az yer kaplasın)
                    const MAX = 160;
                    const ratio = Math.min(1, MAX / Math.max(image.width, image.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(image.width * ratio));
                    canvas.height = Math.max(1, Math.round(image.height * ratio));
                    const ctx = canvas.getContext('2d');
                    const isPng = file.type === 'image/png';
                    if (!isPng) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
                    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
                    let out = canvas.toDataURL('image/webp', 0.85);
                    if (out.indexOf('data:image/webp') !== 0) out = isPng ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.85);
                    selectedImgData = out;
                    const prev = document.getElementById('photoPreviewImg');
                    prev.src = selectedImgData;
                    prev.style.display = 'block';
                    document.getElementById('photoPreviewIcon').style.display = 'none';
                    document.getElementById('photoPreview').classList.add('has-img');
                    setText('pickPhotoLabel', t.changePhoto);
                };
                image.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

        const deleteToggleBtn = document.getElementById('deleteToggleBtn');
        function setDeleteMode(on) {
            isDeleteMode = on;
            deleteToggleBtn.classList.toggle('delete-mode-active', isDeleteMode);
            renderMods();
        }
        deleteToggleBtn.addEventListener('click', () => {
            if (isDeleteMode) { setDeleteMode(false); }   // kapatmak için kod gerekmez
            else { askPassword('delete'); }                // açmak için kod iste
        });


        // ---- Splash intro (cinematic) ----
        function initSplash() {
            const splash = document.getElementById('splashScreen');
            if (!splash) return;
            let leaving = false, tLeave = 0, explodeFn = null;
            const T0 = performance.now();

            function leave() {
                if (leaving) return;
                leaving = true; tLeave = performance.now() - T0;
                splash.classList.add('leaving');
                setTimeout(() => document.body.classList.add('ready'), 260);
                if (explodeFn) explodeFn();
                setTimeout(() => splash.remove(), 650);
            }
            setTimeout(leave, 4100);                       // otomatik çıkış
            splash.addEventListener('click', leave);       // dokununca geç
            if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(leave, 700);

            try {
                // 3D küp yüzleri
                const cube = document.getElementById('splashCube');
                const names = ['front', 'back', 'right', 'left', 'top', 'bottom'];
                const faces = () => names.map((n, i) => '<div class="face f-' + n + '" style="--d:' + i + '"></div>').join('');
                if (cube) cube.innerHTML = faces() + '<div class="core">' + faces() + '</div>';

                const cv = document.getElementById('splashCanvas');
                const ctx = cv.getContext('2d');
                const dpr = Math.min(1.5, window.devicePixelRatio || 1);
                const W = window.innerWidth, H = window.innerHeight;
                cv.width = W * dpr; cv.height = H * dpr;

                // başlık boyutu + konumlar
                const titleEl = document.getElementById('splashTitle');
                const fs = Math.max(26, Math.min(56, W * 0.105));
                titleEl.style.fontSize = fs + 'px';
                const sr = document.getElementById('splashScene').getBoundingClientRect();
                const bx = sr.left + sr.width / 2, by = sr.top + sr.height / 2;
                splash.style.setProperty('--bx', bx + 'px');
                splash.style.setProperty('--by', by + 'px');

                // yazıyı parçacıklara çevir
                const tr = titleEl.getBoundingClientRect();
                const cw = Math.ceil(tr.width + 40), ch = Math.ceil(tr.height + 40);
                const off = document.createElement('canvas'); off.width = cw; off.height = ch;
                const ox = off.getContext('2d');
                ox.font = '900 ' + fs + 'px ' + getComputedStyle(titleEl).fontFamily;
                ox.textAlign = 'center'; ox.textBaseline = 'middle'; ox.fillStyle = '#fff';
                if ('letterSpacing' in ox) ox.letterSpacing = (fs * 0.1) + 'px';
                ox.fillText('MOD MASTER', cw / 2, ch / 2);
                const data = ox.getImageData(0, 0, cw, ch).data;
                const tcx = tr.left + tr.width / 2, tcy = tr.top + tr.height / 2;
                let step = 2, parts = [];
                for (;;) {
                    parts = [];
                    for (let y = 0; y < ch; y += step) for (let x = 0; x < cw; x += step) {
                        if (data[(y * cw + x) * 4 + 3] > 140) {
                            parts.push({ tx: tcx - cw / 2 + x, ty: tcy - ch / 2 + y, x: bx, y: by, vx: 0, vy: 0,
                                         k: 0.02 + Math.random() * 0.022, b: (Math.random() * 3) | 0, out: false });
                        }
                    }
                    if (parts.length <= 1000 || step >= 6) break;
                    step++;
                }
                const colors = ['#ffffff', '#9ad6ff', '#2ea6ff'];

                // yıldız tüneli (warp)
                const stars = Array.from({ length: 170 }, () => ({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() * 0.95 + 0.05 }));
                const scale = Math.max(W, H) * 0.2;
                function drawStars(speed, dt, alpha) {
                    ctx.lineCap = 'round';
                    for (const s of stars) {
                        const z0 = s.z; s.z -= speed * dt;
                        if (s.z <= 0.02) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = 1; continue; }
                        const px = bx + s.x / z0 * scale, py = by + s.y / z0 * scale;
                        const qx = bx + s.x / s.z * scale, qy = by + s.y / s.z * scale;
                        if (qx < -50 || qx > W + 50 || qy < -50 || qy > H + 50) { s.z = 1; s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; continue; }
                        ctx.strokeStyle = 'rgba(170,220,255,' + Math.min(1, (1 - s.z) * alpha).toFixed(3) + ')';
                        ctx.lineWidth = 0.6 + (1 - s.z) * 1.9;
                        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke();
                    }
                }

                const T_FLASH = 1100, T_TEXT = 2400;
                let burst = false, last = T0;
                const fillStart = 1500, fillDur = 2200;
                const bar = document.getElementById('splashBarFill'), pct = document.getElementById('splashPct');

                explodeFn = () => {
                    for (const p of parts) {
                        const a = Math.atan2(p.y - by, p.x - bx), sp = 4 + Math.random() * 13;
                        p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp; p.out = true;
                    }
                };

                function frame(now) {
                    if (!splash.isConnected) return;
                    const t = Math.max(0, now - T0);
                    if (leaving && t - tLeave > 520) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); return; }
                    const dt = Math.min(3, (now - last) / 16.67); last = now;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.clearRect(0, 0, W, H);
                    ctx.globalCompositeOperation = 'lighter';

                    // hız: tünel hızlanır -> patlama -> yavaşlar
                    let speed;
                    if (t < T_FLASH) speed = 0.004 + Math.pow(t / T_FLASH, 2.4) * 0.09;
                    else speed = 0.0025 + 0.09 * Math.exp(-(t - T_FLASH) / 260);
                    if (leaving) speed = 0.0025 + 0.06 * Math.min(1, (t - tLeave) / 450);
                    drawStars(speed, dt, t < T_FLASH ? 1.1 : 0.7);

                    // patlama: parçacıklar küpten fırlar
                    if (!burst && t >= T_FLASH + 60) {
                        burst = true;
                        for (const p of parts) {
                            const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 13, tv = (Math.random() - 0.5) * 9;
                            p.vx = Math.cos(a) * sp - Math.sin(a) * tv; p.vy = Math.sin(a) * sp + Math.cos(a) * tv;
                        }
                    }
                    if (burst) {
                        let pa = Math.min(1, (t - T_FLASH - 60) / 150);
                        if (t > T_TEXT) pa *= 1 - 0.72 * Math.min(1, (t - T_TEXT) / 450);
                        if (leaving) pa = 1;
                        const damp = Math.pow(0.925, dt);
                        for (const p of parts) {
                            if (p.out) { p.x += p.vx * dt; p.y += p.vy * dt; continue; }
                            p.vx = (p.vx + (p.tx - p.x) * p.k * dt) * damp;
                            p.vy = (p.vy + (p.ty - p.y) * p.k * dt) * damp;
                            p.x += p.vx * dt; p.y += p.vy * dt;
                        }
                        ctx.globalAlpha = pa;
                        for (let b = 0; b < 3; b++) {
                            ctx.fillStyle = colors[b];
                            for (const p of parts) if (p.b === b) ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
                        }
                        // hızlı parçacıklara iz çiz
                        ctx.strokeStyle = 'rgba(150,215,255,0.75)'; ctx.lineWidth = 1.2; ctx.beginPath();
                        for (const p of parts) if (Math.abs(p.vx) + Math.abs(p.vy) > 9) { ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2); }
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }

                    // yüzde sayacı
                    const u = Math.min(1, Math.max(0, (t - fillStart) / fillDur));
                    const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
                    if (bar) bar.style.width = (e * 100) + '%';
                    if (pct) pct.textContent = Math.round(e * 100);

                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
            } catch (err) { /* animasyon bozulsa bile site açılır */ }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSplash();
            applyTheme(currentTheme);
            applyLang(currentLang);
            renderAll();
            if (CLOUD) {
                loadCloudMods();
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden && cloudState !== 'loading' && Date.now() - lastCloudLoad > 30000) loadCloudMods();
                });
            }
        });
    </script>
